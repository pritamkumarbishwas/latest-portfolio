name: Eval Chat

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *" # Nightly

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Eval
        run: npm run eval:chat
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
